name: Update store text metadata

on:
  workflow_dispatch:

jobs:
  text:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install fastlane
      run: gem install fastlane --no-document

    # Uploads ONLY the textual Play listing (titles, short/full descriptions,
    # video). No images, no screenshots, no AAB, no changelogs (changelogs are
    # release-coupled and handled by the release workflow).
    - name: Update store text metadata
      env:
        SUPPLY_JSON_KEY_DATA: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      run: |
        fastlane supply \
          --package_name com.github.meypod.al_azan \
          --metadata_path fastlane/metadata/android \
          --skip_upload_apk true \
          --skip_upload_aab true \
          --skip_upload_changelogs true \
          --skip_upload_images true \
          --skip_upload_screenshots true
